*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}a{color:inherit;text-decoration:none}

label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b0b0f,#2b0a14)}
.box{background:var(--card);border-radius:18px;padding:30px;width:100%;max-width:400px}

.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.err{color:#d33;font-size:13px;min-height:18px;margin-top:8px}
/* shell */
.shell{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#cfd5df;padding:18px 12px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:20;transition:.2s}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--o);display:grid;place-items:center}

aside a:hover{background:#ffffff14}aside a.on{background:var(--o);color:#fff}
aside .sp{flex:1}
main{margin-left:230px;flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}.top small{color:var(--mut);display:block}
.burger{display:none}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:2fr 1fr}
.c{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px #0000000d}
.c h3{margin:0 0 12px;font-size:16px}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
.stat{border-left:5px solid var(--k)}
.chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px}
.chart div.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{display:block;width:40%;border-radius:5px 5px 0 0;min-height:2px}
.chart small{color:var(--mut);margin-top:6px}
.leg{font-size:13px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}

.donut:after{content:"";position:absolute;inset:30px;background:var(--card);border-radius:50%}
.dl{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}.dl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
table{width:100%;border-collapse:collapse;font-size:14px}

td{padding:11px 8px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.green{background:#dff7dd;color:#1e7a1e}.pill.blue{background:#fde4ec;color:#8f1230}.pill.yellow{background:#fff1c4;color:#8a6700}

.note{color:var(--mut);font-size:13px;margin-bottom:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tools input{width:200px}.tools select{width:130px}
.pc{background:var(--pc);border-radius:24px;padding:22px 26px;margin-bottom:16px;display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:center}
.pc h3{margin:0 0 10px;font-size:22px;text-align:center}

.prog i{position:absolute;inset:0 auto 0 0;background:#b6ff6e;border-radius:99px}

.done{background:#4cff00;border-radius:99px;height:46px;display:grid;place-items:center;font-weight:500}
.acts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}

.mod h3{margin:0 0 6px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;color:var(--mut);padding:30px}

.gax{display:flex;justify-content:space-between;margin-left:160px;font-size:12px;color:var(--mut)}
.big{max-width:100%;max-height:90vh;border-radius:10px}

/* ---------- AUTH ---------- */
let authTab='in';
function authView(){
$('#app').innerHTML=`<div class="auth"><div class="box"><div style="text-align:center"><img class="alogo" src="${biz().logo}"></div><h1 style="text-align:center">${esc(biz().name)}</h1><p>${authTab==='in'?'Sign in to continue':'Create your account'}</p>
<div class="tabs"><button class="${authTab==='in'?'on':''}" onclick="authTab='in';authView()">Sign In</button><button class="${authTab==='up'?'on':''}" onclick="authTab='up';authView()">Sign Up</button></div>
<form onsubmit="doAuth(event)">${authTab==='up'?'<label>Full name</label><input name="name" required>':''}
<label>Email</label><input name="email" type="email" required><label>Password</label><input name="pw" type="password" minlength="6" required>
${authTab==='up'?'<label>Confirm password</label><input name="pw2" type="password" required>':''}
<div class="err" id="err"></div><button class="btn" style="width:100%;margin-top:6px">${authTab==='in'?'Sign In':'Sign Up'}</button></form></div></div>`}
async function doAuth(e){
e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const users=ld('apc_users',[]);const email=f.email.toLowerCase().trim();const h=await sha(f.pw);
if(authTab==='up'){
 if(f.pw!==f.pw2)return $('#err').textContent='Hindi magkapareho ang password.';
 if(users.some(u=>u.email===email))return $('#err').textContent='May account na ang email na ito.';
 users.push({name:f.name,email,h});sv('apc_users',users);sv('apc_session',{name:f.name,email});
}else{
 const u=users.find(u=>u.email===email&&u.h===h);if(!u)return $('#err').textContent='Mali ang email o password.';
 {const{h:_,...ss}=u;sv('apc_session',ss)}
}
location.hash='#/dashboard';boot()}
function logout(){localStorage.removeItem('apc_session');location.hash='';boot()}

function applyTheme(){const b=biz(),r=document.documentElement.style;let t=THEMES[b.color];if(!t){const c=b.custom;t=[c,`color-mix(in srgb,${c} 65%,#fff)`,`color-mix(in srgb,${c} 60%,#000)`]}
r.setProperty('--o',t[0]);r.setProperty('--fu',t[1]);r.setProperty('--mar',t[2]);document.title=b.name;
let l=document.querySelector('link[rel=icon]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}l.href=b.logo}
applyTheme();

m.innerHTML=`<form><h3>Settings</h3><div style="text-align:center;margin:10px 0"><img class="alogo" src="${b.logo}"></div><label>Business logo</label><input type="file" name="logo" accept="image/*"><label>Business name</label><input name="name" value="${esc(b.name)}" required>
<label>System theme color</label><div class="sw">${Object.entries(THEMES).map(([k,v])=>`<label class="swb"><input type="radio" name="color" value="${k}" ${b.color===k?'checked':''}><i style="background:${v[0]}"></i>${k[0].toUpperCase()+k.slice(1)}</label>`).join('')}<label class="swb"><input type="radio" name="color" value="custom" ${b.color==='custom'?'checked':''}>Custom <input type="color" name="custom" value="${b.custom}"></label></div>
<div class="row"><button type="button" class="btn g" onclick="this.closest('.mod').remove()">Cancel</button><button class="btn">Save</button></div></form>`;
m.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),f=fd.get('logo'),n={name:fd.get('name').trim(),color:fd.get('color'),custom:fd.get('custom'),logo:b.logo};
if(f&&f.size)n.logo=await shrink(f,300);sv('apc_set',n);applyTheme();m.remove();route()};document.body.appendChild(m)}
const IC={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>'};

const dlMenu=x=>`<div class="dd"><button class="btn g s" onclick="const m=this.nextElementSibling,o=m.classList.contains('show');closeM();if(!o)m.classList.add('show')">⬇ Download</button><div class="pm"><a onclick="closeM();dl('pdf')">Download as PDF</a><a onclick="closeM();dl('img')">Download as Image (PNG)</a>${x?`<a onclick="closeM();${x}">Download as Excel (.xlsx)</a>`:''}</div></div>`;

async function xlX(){await lib('XLSX',XL);const wb=XLSX.utils.book_new(),P=db.projects.filter(p=>xp==='all'||p.id===xp);
sheet(wb,'Cost per Project',P.map(p=>{const c=costs(p);return{Project:p.title,'Bid Amount':p.bid,Expenses:c.exp,'Delivered Materials':c.dv,'Labor Cost':c.lab,Obligations:c.obl,'Total Cost':c.t}}));
sheet(wb,'Expenses',db.expenses.filter(e=>P.some(p=>p.title===e.project)).map(({id,...r})=>r));XLSX.writeFile(wb,`Expenses_${iso(new Date())}.xlsx`)}

const th=()=>ld('apc_theme','light');
document.documentElement.dataset.theme=th();

const avatar=(u,z=36)=>u.photo?`<img class="av" src="${u.photo}" style="width:${z}px;height:${z}px">`:`<div class="av" style="width:${z}px;height:${z}px">${esc(((u.name||'?').trim()[0]||'?').toUpperCase())}</div>`;
const readF=f=>new Promise(r=>{const a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f)});
const shrink=async(f,max)=>{const u=await readF(f);return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=u})};
const lib=async(k,u)=>{if(window[k])return;for(const x of [].concat(u)){try{await new Promise((r,j)=>{const e=document.createElement('script');e.src=x;e.onload=r;e.onerror=j;document.head.appendChild(e)});if(window[k])return}catch(e){}}alert('Kailangan ng internet para sa export.');throw new Error('lib')};
function shell(page,title,sub,body,right=''){

${NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]===page?'on':''}" onclick="$('#side').classList.remove('open')"><span>${n[2]}</span>${n[1]}</a>`).join('')}
<div class="sp"></div>
</aside><div class="bd" onclick="$('#side').classList.remove('open')"></div>
<main><div class="nav"><button class="btn g burger" onclick="$('#side').classList.toggle('open')">☰</button><div class="srch"><input id="gs" placeholder="Search projects, clients, expenses, documents…" autocomplete="off" oninput="gsearch(this.value)" onkeydown="if(event.key==='Enter')$('#gres a')?.click()"><div id="gres" class="gres"></div></div><div class="sp"></div>

<div class="top"><div><h2>${title}</h2><small>${sub}</small></div><div class="tools">${right}</div></div><div id="export"><div class="phd"><img src="${bz.logo}"><div><b>${esc(bz.name)}</b><span>${title} · ${sub}</span><span>Generated ${new Date().toLocaleString()}</span></div></div>${body}</div></main></div>`}
function editProfile(){
const u=ld('apc_session'),m=document.createElement('div');m.className='mod';
m.innerHTML=`<form><h3>My Profile</h3><div style="text-align:center;margin:10px 0">${avatar(u,80)}</div><label>Change profile photo</label><input type="file" name="photo" accept="image/*"><label>Full name</label><input name="name" value="${esc(u.name)}" required><label>Email</label><input name="email" type="email" value="${esc(u.email)}" required><label>Phone</label><input name="phone" value="${esc(u.phone)}"><label>Role / Position</label><input name="role" value="${esc(u.role||'Administrator')}"><div class="row"><button type="button" class="btn g" onclick="this.closest('.mod').remove()">Cancel</button><button class="btn">Save</button></div></form>`;
m.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),f=fd.get('photo');
const n={...u,name:fd.get('name'),email:fd.get('email').toLowerCase().trim(),phone:fd.get('phone'),role:fd.get('role')};
if(f&&f.size)n.photo=await shrink(f,240);
const us=ld('apc_users',[]),i=us.findIndex(x=>x.email===u.email);if(i>-1)us[i]={...us[i],name:n.name,email:n.email,phone:n.phone,role:n.role,photo:n.photo};
sv('apc_users',us);sv('apc_session',n);m.remove();route()};
document.body.appendChild(m)}

/* ---------- DASHBOARD ---------- */
const iso=d=>{const z=new Date(d);return new Date(z.getTime()-z.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let dr={};
function setRange(m){const t=new Date(),to=iso(t);let f=to;
if(m==='W'){const d=new Date(t);d.setDate(d.getDate()-6);f=iso(d)}
if(m==='M')f=to.slice(0,8)+'01';if(m==='Y')f=to.slice(0,4)+'-01-01';dr={mode:m,from:f,to}}
setRange('M');
const inR=d=>d&&d>=dr.from&&d<=dr.to;

const st=r=>r.pct>=100?['Done','#2e9e4f']:r.end<nd?['Delayed','var(--mar)']:r.pct>0?['In progress','var(--o)']:['Not started','#8a8a96'];
return`<div class="c" style="margin-top:16px">${head}<div class="g2w"><div class="gg"><div class="gh">${tk.map(t=>`<span style="left:${t[0]}%">${t[1]}</span>`).join('')}</div>
${rows.map(r=>{const[n,c]=st(r);return`<div class="gl2"><b style="flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25">${esc(r.task)}<small class="mut">${r.start} → ${r.end} · <span style="color:${c};font-weight:700">${n}</span></small></b><div class="tr">${gv}<div class="bar s" style="--c:${c};left:${X(D(r.start))}%;width:${Math.max(X(D(r.end))-X(D(r.start)),1.5)}%" title="${esc(r.task)} · ${r.pct}%"><u style="width:${r.pct}%"></u></div><em class="pc2" style="left:calc(${X(D(r.end))}% + 6px)">${r.pct}%</em></div></div>`}).join('')}${tl}</div></div>
<div class="lg"><span><i style="background:#2e9e4f"></i>Done</span><span><i style="background:var(--o)"></i>In progress</span><span><i style="background:var(--mar)"></i>Delayed</span><span><i style="background:#8a8a96"></i>Not started</span><span><i style="background:var(--o)"></i>Today line</span><span class="mut">Solid fill = % tapos na · light bar = planned dates</span></div></div>`}
let ptab='budget';
const TABS=[['budget','Budget & Profit'],['expenses','Expenses'],['estimated','Estimated Materials'],['leaders','Team Leaders'],['swa','SWA Work Items'],['photos','Photos'],['pdocs','Documents']];
const rowsOf=(k,p)=>k==='expenses'?db.expenses.filter(r=>r.project===p.title):db[k].filter(r=>r.pid===p.id);
const swaPct=p=>{const r=db.swa.filter(x=>x.pid===p.id),d=x=>Math.max(1,(new Date(x.end)-new Date(x.start))/864e5||1),t=sum(r,d);return t?Math.round(sum(r,x=>x.pct*d(x))/t):0};
function gantt(rows){rows=rows.filter(r=>r.start&&r.end);if(!rows.length)return'';
const t=d=>new Date(d).getTime(),mn=Math.min(...rows.map(r=>t(r.start))),mx=Math.max(...rows.map(r=>t(r.end))),sp=Math.max(mx-mn,864e5);
return`<div class="gantt">${rows.map(r=>{const l=(t(r.start)-mn)/sp*100,w=Math.max((t(r.end)-t(r.start))/sp*100,2);return`<div class="gr"><div class="gl">${esc(r.task)}</div><div class="gt"><div class="gb" style="left:${l}%;width:${w}%"><i style="width:${r.pct}%"></i><span>${r.pct}%</span></div></div></div>`}).join('')}<div class="gax"><span>${new Date(mn).toLocaleDateString()}</span><span>${new Date(mx).toLocaleDateString()}</span></div></div>`}
function subTable(k,p,pre=''){const s=SC(k),rows=rowsOf(k,p),T=s.tot,TF=T||(k==='expenses'||k==='bale'?r=>r.amount:null);
return`<div class="c"><div class="sh"><h3>${s.t}</h3><button class="btn s" onclick="openForm('${k}',null,'${p.id}')">+ Add</button></div>${pre}<div class="wrap"><table><tr>${s.f.map(f=>`<th>${f[1].toUpperCase()}</th>`).join('')}${T?'<th>TOTAL</th>':''}<th></th></tr>
${rows.map(r=>`<tr>${s.f.map(f=>`<td>${cell(f,r)}</td>`).join('')}${T?`<td>${peso(T(r))}</td>`:''}${btns(k,r.id)}</tr>`).join('')||'<tr><td colspan=9 class="empty">Wala pang laman.</td></tr>'}</table></div>${TF&&rows.length?`<p class="tt">Total: <b>${peso(sum(rows,TF))}</b></p>`:''}</div>`}
function oblSection(p){
const rate=p.oblRate??16,tot=Math.round(p.bid*rate/100);let bal=tot;
const rows=rowsOf('obligations',p).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
return`<div class="c"><div class="sh"><h3>Obligations (Passbook)</h3><button class="btn s" onclick="openForm('obligations',null,'${p.id}')">+ Add payment</button></div>
<div class="obl"><label>Rate (%)</label><input type="number" min="0" step="any" value="${rate}" onchange="setRate('${p.id}',this.value)"><div>${peso(p.bid)} × ${rate}% = <b>Total obligation ${peso(tot)}</b></div></div>
<div class="wrap"><table><tr><th>DATE</th><th>AMOUNT</th><th>BALANCE</th><th></th></tr><tr><td class="mut">Start</td><td>—</td><td><b>${peso(tot)}</b></td><td></td></tr>
${rows.map(r=>{bal-=r.amount;return`<tr><td>${esc(r.date)}</td><td>${peso(r.amount)}</td><td><b>${peso(bal)}</b></td>${btns('obligations',r.id)}</tr>`}).join('')}</table></div>
<p class="tt">Paid: <b>${peso(tot-bal)}</b> (${pct(tot-bal,tot)}%) · Remaining: <b>${peso(bal)}</b></p></div>`}
function setRate(id,v){db.projects.find(x=>x.id===id).oblRate=Number(v)||0;save();projectView(id)}
function expView(p,v){
const it=[['Expenses (general)',v.exp,'var(--o)'],['Delivered Materials',v.dv,'var(--mar)'],['Labor Cost (gross wages)',v.lab,'var(--fu)'],[`Obligations (${v.rate}%)`,v.obl,'#3a3a46']],T=sum(it,i=>i[1]);let a=0;
const g=T?it.map(i=>{const b=a;a+=i[1]/T*100;return`${i[2]} ${b}% ${a}%`}).join(','):'#8884 0 100%';
return`<div class="c"><h3>Project Expenses Summary</h3><div class="exg"><ul class="bl">${it.map(i=>`<li><span><i style="background:${i[2]}"></i>${i[0]}</span><b>${peso(i[1])}</b><div class="pbar"><i style="width:${pct(i[1],T)}%;background:${i[2]}"></i></div><small class="mut">${pct(i[1],T)}% of total</small></li>`).join('')}<li class="tot"><span>Total Project Expenses</span><b>${peso(T)}</b></li></ul></div>
</div>`
+subTable('expenses',p)+subTable('delivered',p)+subTable('labor',p)+oblSection(p)}
function projectView(id){
const p=db.projects.find(x=>x.id===id);if(!p){location.hash='#/projects';return}
const R=k=>rowsOf(k,p),exp=sum(R('expenses'),r=>r.amount),lab=sum(R('labor'),SUB.labor.tot),dv=sum(R('delivered'),SUB.delivered.tot),est=sum(R('estimated'),SUB.estimated.tot);
const rate=p.oblRate??16,obl=Math.round(p.bid*rate/100),paid=sum(R('obligations'),r=>r.amount),bale=sum(R('bale'),r=>r.amount);
const cost=exp+lab+dv+obl,profit=p.bid-cost,coll=sum(db.billing.filter(b=>b.project===p.title&&b.status==='paid'),b=>b.amount);
let c;
if(ptab==='budget')c=`<div class="grid g4">${stat(peso(p.bid),'Contract / Bid Amount','var(--o)')}${stat(peso(cost),'Total Costs','var(--fu)',pct(cost,p.bid)+'% of bid')}${stat(peso(profit),'Running Balance (Profit)',profit<0?'#d33':'#3da63d',pct(profit,p.bid)+'% margin')}${stat(peso(obl-paid),'Obligation Balance','var(--mar)','paid '+peso(paid))}${stat(peso(coll),'Collected (Billing)','#4b4b57',pct(coll,p.bid)+'% of bid')}${stat(swaPct(p)+'%','SWA Accomplished','var(--o)')}${stat(peso(est),'Estimated Materials','#9aa5b1')}${stat(peso(lab),'Labor Cost','var(--fu)',pct(lab,p.bid)+'% of bid')}</div>
<div class="c" style="margin-top:14px"><h3>Cost Breakdown</h3><div class="wrap"><table><tr><th>ITEM</th><th>AMOUNT</th><th>% OF BID</th></tr>${[['Expenses',exp],['Delivered Materials',dv],['Labor Cost',lab],['Obligations ('+rate+'%)',obl]].map(([n,v])=>`<tr><td>${n}</td><td>${peso(v)}</td><td>${pct(v,p.bid)}%</td></tr>`).join('')}<tr><td><b>Running Balance (Profit)</b></td><td><b>${peso(profit)}</b></td><td>${pct(profit,p.bid)}%</td></tr></table></div></div>`;
else if(ptab==='expenses')c=expView(p,{exp,lab,dv,obl,rate,paid,bale});
else if(ptab==='photos')c=`<div class="c"><div class="sh"><h3>Project Photos</h3><button class="btn s" onclick="openForm('photos',null,'${p.id}')">+ Upload photo</button></div><div class="ph">${R('photos').map(r=>`<figure><img src="${r.img}" onclick="view('${r.id}')"><figcaption>${esc(r.caption)}<small>${esc(r.date)}</small><div class="act" style="text-align:left;margin-top:6px"><button class="btn g s" onclick="openForm('photos','${r.id}')">Edit</button> <button class="btn g s" onclick="del('photos','${r.id}')">Delete</button></div></figcaption></figure>`).join('')||'<div class="empty">Wala pang photos.</div>'}</div></div>`;
else c=subTable(ptab,p);
shell('projects',esc(p.title),`${esc(p.client)||'—'} · ${esc(p.location)} · Progress ${p.progress}%`,`<div class="ptabs">${TABS.map(([k,l])=>`<button class="${k===ptab?'on':''}" onclick="ptab='${k}';projectView('${id}')">${l}</button>`).join('')}</div>${c}${ptab==='swa'?pgantt(p):''}`,
`<a class="btn g" href="#/projects">← Projects</a>${dlMenu("xlP('"+id+"')")}`)}
async function xlP(id){const p=db.projects.find(x=>x.id===id);await lib('XLSX',XL);const wb=XLSX.utils.book_new();
sheet(wb,'Project',[{Title:p.title,Client:p.client,Bid:p.bid,Location:p.location,'Date Bidded':p.dateBid,'Date Started':p.dateStart,License:p.license,Progress:p.progress}]);
['expenses','labor','delivered','estimated','leaders','obligations','swa'].forEach(k=>sheet(wb,SC(k).t,rowsOf(k,p).map(strip)));XLSX.writeFile(wb,`${p.title}.xlsx`)}

/* ---------- GLOBAL SEARCH ---------- */
function sidx(){const P=id=>db.projects.find(p=>p.id===id)?.title||'',I=[],add=(t,x,h,o)=>I.push({t,x:x.toLowerCase(),h,...o});
db.projects.forEach(p=>add('Project',`${p.title} ${p.location} ${p.client} ${p.license}`,'#/project/'+p.id,{l:p.title,s:p.location,tab:'budget'}));
db.clients.forEach(c=>add('Client',`${c.name} ${c.email} ${c.address} ${c.contact}`,'#/clients',{l:c.name,s:c.address}));
db.billing.forEach(b=>add('Billing',`${b.project} ${b.status}`,'#/billing',{l:b.project,s:peso(b.amount)+' · '+b.status}));
db.documents.forEach(d=>add('Document',`${d.title} ${d.type} ${d.notes}`,'#/documents',{l:d.title,s:d.type}));
db.expenses.forEach(e=>add('Expense',`${e.description} ${e.category} ${e.project}`,'#/expenses',{l:e.description,s:`${e.project} · ${peso(e.amount)}`,xp:db.projects.find(x=>x.title===e.project)?.id}));
[['delivered','Delivered','expenses',r=>r.name+' '+r.supplier],['labor','Labor','expenses',r=>r.description],['obligations','Obligation','expenses',r=>'Payment '+r.date+' '+r.note],['leaders','Team Leader','leaders',r=>r.name+' '+r.role],['swa','SWA','swa',r=>r.task],['photos','Photo','photos',r=>r.caption],['pdocs','Project Doc','pdocs',r=>r.title+' '+r.notes],['estimated','Est. Material','estimated',r=>r.name]]
.forEach(([k,t,tab,f])=>db[k].forEach(r=>add(t,f(r)+' '+P(r.pid),'#/project/'+r.pid,{l:f(r).trim(),s:P(r.pid),tab})));
return I}
function gsearch(q){q=q.trim().toLowerCase();const el=$('#gres');if(q.length<2){el.innerHTML='';return}
const r=sidx().filter(i=>i.x.includes(q)).slice(0,12);
el.innerHTML=r.map(i=>`<a onclick="go('${i.h}','${i.tab||''}','${i.xp||''}')"><b>${esc(i.l)}</b><small>${i.t} · ${esc(i.s)}</small></a>`).join('')||'<a><small>Walang nahanap.</small></a>'}
function go(h,t,x){if(t)ptab=t;if(h==='#/expenses')xp=x||'all';$('#gres').innerHTML='';location.hash===h?route():location.hash=h}
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))$('#gres')&&($('#gres').innerHTML='');if(!e.target.closest('.dd,.me'))closeM()});

/* ---------- EXPENSES (per project, with analytics) ---------- */
let xp='all';
const costs=p=>{const exp=sum(rowsOf('expenses',p),r=>r.amount),dv=sum(rowsOf('delivered',p),SUB.delivered.tot),lab=sum(rowsOf('labor',p),SUB.labor.tot),obl=Math.round(p.bid*(p.oblRate??16)/100);return{exp,dv,lab,obl,t:exp+dv+lab+obl}};
const xrows=rows=>`<div class="wrap"><table><tr><th>DESCRIPTION</th><th>CATEGORY</th><th>AMOUNT</th><th>DATE</th><th></th></tr>${[...rows].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<tr><td>${esc(r.description)}</td><td>${esc(r.category)}</td><td>${peso(r.amount)}</td><td>${esc(r.date)}</td>${btns('expenses',r.id)}</tr>`).join('')||'<tr><td colspan=5 class="empty">Wala pang expense.</td></tr>'}</table></div>`;
function expensesPage(){
const C=db.projects.filter(p=>xp==='all'||p.id===xp).map(p=>({p,c:costs(p)})),tt=k=>sum(C,x=>x.c[k]),T=tt('t');
const cats=[['Expenses','exp','var(--o)'],['Delivered Materials','dv','var(--mar)'],['Labor Cost','lab','var(--fu)'],['Obligations','obl','#3a3a46']];
let a=0;const g=T?cats.map(c=>{const b=a;a+=tt(c[1])/T*100;return`${c[2]} ${b}% ${a}%`}).join(','):'#8884 0 100%';
const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return iso(d).slice(0,7)}),ti=C.map(x=>x.p.title);
const MS=months.map(m=>sum(db.expenses.filter(e=>ti.includes(e.project)&&(e.date||'').startsWith(m)),e=>e.amount)),mx=Math.max(1,...MS);
const un=xp==='all'?db.expenses.filter(e=>!db.projects.some(p=>p.title===e.project)):[];
shell('expenses','Total Expenses of All Projects',biz().name+' · hiwalay ang bawat project',`
<div class="ptabs"><button class="${xp==='all'?'on':''}" onclick="xp='all';expensesPage()">All Projects</button>${db.projects.map(p=>`<button class="${xp===p.id?'on':''}" onclick="xp='${p.id}';expensesPage()">${esc(p.title)}</button>`).join('')}</div>
<div class="grid g4">${stat(peso(T),'Total Project Costs','var(--o)',C.length+' project'+(C.length>1?'s':''))}${cats.map(c=>stat(peso(tt(c[1])),c[0],c[2],pct(tt(c[1]),T)+'% of total')).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="c"><h3>Monthly Expenses (6 months) <span class="mut">· % of total</span></h3><div class="chart">${months.map((m,i)=>`<div class="col"><div class="bars"><div style="width:55%"><small>${sh(MS[i])}<br>${pct(MS[i],sum(MS,x=>x))}%</small><i style="height:calc((100% - 30px)*${MS[i]/mx});background:var(--o)"></i></div></div><small class="lbl"><b>${new Date(m+'-02').toLocaleString('en',{month:'short'})}</b></small></div>`).join('')}</div></div>
<div class="c"><h3>Cost Breakdown</h3><div class="donut" style="background:conic-gradient(${g})"><span class="dl2"><b>${sh(T)}</b><small>Total</small></span></div>${cats.map(c=>`<div class="dl"><span><i style="background:${c[2]}"></i>${c[0]}</span><b>${pct(tt(c[1]),T)}%</b></div>`).join('')}</div></div>
<div class="c" style="margin-top:14px"><h3>Cost per Project</h3>${C.map(({p,c})=>`<div class="lv"><div class="h"><span>${esc(p.title)}</span><b>${peso(c.t)} · ${pct(c.t,p.bid)}% of bid</b></div><div class="pbar"><i style="width:${Math.min(100,pct(c.t,p.bid))}%;background:linear-gradient(90deg,var(--fu),var(--o))"></i></div></div>`).join('')||'<div class="empty">No projects</div>'}</div>
${C.map(({p,c})=>`<div class="c" style="margin-top:14px"><div class="sh"><h3><a href="#/project/${p.id}">${esc(p.title)}</a></h3></div>
<p class="mut" style="margin:0 0 10px">Expenses ${peso(c.exp)} · Materials ${peso(c.dv)} · Labor ${peso(c.lab)} · Obligations ${peso(c.obl)} · <b>Total ${peso(c.t)}</b></p>${xrows(rowsOf('expenses',p))}<p class="tt">Subtotal: <b>${peso(c.exp)}</b></p></div>`).join('')}
${un.length?`<div class="c" style="margin-top:14px"><h3>Unassigned</h3>${xrows(un)}</div>`:''}
<div class="c" style="margin-top:14px;text-align:right;font-size:18px">TOTAL: <b>${peso(tt('exp')+sum(un,e=>e.amount))}</b> <span class="mut">(listed expenses)</span></div>`,
dlMenu('xlX()'))}

/* ---------- DOCUMENTS ---------- */
let dt='All';
function documentsPage(){
const types=['All','Permit','Business Paper','Contract','Plan','Receipt','Other'],rows=db.documents.filter(d=>dt==='All'||d.type===dt).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
shell('documents','Documents','Permits at iba pang papeles ng negosyo',`<div class="ptabs">${types.map(t=>`<button class="${t===dt?'on':''}" onclick="dt='${t}';documentsPage()">${t}${t==='All'?' ('+db.documents.length+')':''}</button>`).join('')}</div>
<div class="ph dg">${rows.map(d=>`<figure>${d.img?`<img src="${d.img}" onclick="view('${d.id}')">`:'<div class="nof">▢</div>'}<figcaption><b>${esc(d.title)}</b><small>${esc(d.type)} · ${esc(d.date)}</small>${d.notes?`<small>${esc(d.notes)}</small>`:''}<div class="act" style="text-align:left;margin-top:8px"><button class="btn g s" onclick="openForm('documents','${d.id}')">Edit</button> <button class="btn g s" onclick="del('documents','${d.id}')">Delete</button></div></figcaption></figure>`).join('')||'<div class="empty c">Wala pang documents.</div>'}</div>`,
`<button class="btn" onclick="openForm('documents')">+ Add Document</button>`)}
/* ---------- REPORTS ---------- */
function reports(){
const ms=[...new Set([...db.billing.map(b=>b.date.slice(0,7)),...db.expenses.map(e=>e.date.slice(0,7))])].sort().reverse();
let tb=0,tc=0,te=0;
const rows=ms.map(m=>{const b=sum(db.billing.filter(x=>x.date.startsWith(m)),x=>x.amount),c=sum(db.billing.filter(x=>x.date.startsWith(m)&&x.status==='paid'),x=>x.amount),e=sum(db.expenses.filter(x=>x.date.startsWith(m)),x=>x.amount);tb+=b;tc+=c;te+=e;
return`<tr><td>${new Date(m+'-02').toLocaleString('en',{month:'long',year:'numeric'})}</td><td>${peso(b)}</td><td>${peso(c)}</td><td>${peso(e)}</td><td><b style="color:${c-e<0?'#d33':'#1e7a1e'}">${peso(c-e)}</b></td></tr>`}).join('');
shell('reports','Monthly Report','Billing, collections and expenses per month',`<div class="grid g4">${stat(peso(tb),'Total Billed','var(--o)')}${stat(peso(tc),'Total Collected','#4b4b57')}${stat(peso(te),'Total Expenses','var(--fu)')}${stat(peso(tc-te),'Net (Collected − Expenses)','#3da63d')}</div>
<div class="c" style="margin-top:14px"><div class="wrap"><table><tr><th>MONTH</th><th>BILLED</th><th>COLLECTED</th><th>EXPENSES</th><th>NET</th></tr>${rows||'<tr><td colspan=5 class="empty">No data</td></tr>'}</table></div></div>`,
dlMenu(''))}

/* ---------- ROUTER ---------- */
function route(){
const p=(location.hash.replace('#/','')||'dashboard');
if(p.startsWith('project/'))projectView(p.slice(8));else if(p==='dashboard')dashboard();else if(p==='projects')projects();else if(p==='reports')reports();else if(p==='expenses')expensesPage();else if(p==='documents')documentsPage();else if(SCHEMA[p])module(p);else dashboard()}
function boot(){ld('apc_session')?route():authView()}
addEventListener('hashchange',()=>ld('apc_session')&&route());
boot();
</script>
</body>
</html>
